<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#555"/></marker><marker id="ahc" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#0f172a"/></marker></defs>
<text x="505.0" y="28" font-size="19" text-anchor="middle" fill="#0f172a" font-weight="bold">How Muon and RMNP treat a 2D update</text>
<text x="505.0" y="48" font-size="12.5" text-anchor="middle" fill="#64748b" font-weight="normal">weight shape = (output, input) = (size(0), size(1))</text>
<line x1="505.0" y1="62.0" x2="505.0" y2="306.0" stroke="#cbd5e1" stroke-width="1.4"/>
<text x="255" y="78" font-size="15" text-anchor="middle" fill="#1e293b" font-weight="bold">Matrix shape and transpose</text>
<text x="760" y="78" font-size="15" text-anchor="middle" fill="#1e293b" font-weight="bold">RMNP row normalization</text>
<rect x="80" y="108" width="28" height="28" rx="3" fill="#e8eefc" stroke="#334155" stroke-width="1.5"/><rect x="108" y="108" width="28" height="28" rx="3" fill="#e8eefc" stroke="#334155" stroke-width="1.5"/><rect x="136" y="108" width="28" height="28" rx="3" fill="#e8eefc" stroke="#334155" stroke-width="1.5"/><rect x="80" y="136" width="28" height="28" rx="3" fill="#e8eefc" stroke="#334155" stroke-width="1.5"/><rect x="108" y="136" width="28" height="28" rx="3" fill="#e8eefc" stroke="#334155" stroke-width="1.5"/><rect x="136" y="136" width="28" height="28" rx="3" fill="#e8eefc" stroke="#334155" stroke-width="1.5"/><rect x="80" y="164" width="28" height="28" rx="3" fill="#e8eefc" stroke="#334155" stroke-width="1.5"/><rect x="108" y="164" width="28" height="28" rx="3" fill="#e8eefc" stroke="#334155" stroke-width="1.5"/><rect x="136" y="164" width="28" height="28" rx="3" fill="#e8eefc" stroke="#334155" stroke-width="1.5"/><rect x="80" y="192" width="28" height="28" rx="3" fill="#e8eefc" stroke="#334155" stroke-width="1.5"/><rect x="108" y="192" width="28" height="28" rx="3" fill="#e8eefc" stroke="#334155" stroke-width="1.5"/><rect x="136" y="192" width="28" height="28" rx="3" fill="#e8eefc" stroke="#334155" stroke-width="1.5"/>
