<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="330" viewBox="0 0 1040 330" font-family="Helvetica,Arial,sans-serif">
<rect width="1040" height="330" fill="#ffffff"/>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#555"/></marker></defs>
<text x="520.0" y="30" font-size="24" text-anchor="middle" fill="#0f172a" font-weight="bold">How Muon and RMNP treat a 2D update</text>
<text x="520.0" y="52" font-size="16" text-anchor="middle" fill="#64748b" font-weight="normal">weight shape = (output, input) = (size(0), size(1))</text>
<line x1="505.0" y1="66.0" x2="505.0" y2="316.0" stroke="#cbd5e1" stroke-width="1.4"/>
<text x="255" y="86" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="bold">Matrix shape and transpose</text>
<text x="775" y="86" font-size="19" text-anchor="middle" fill="#1e293b" font-weight="bold">RMNP row normalization</text>
<rect x="70" y="132" width="28" height="28" rx="3" fill="#e8eefc" stroke="#334155" stroke-width="1.6"/><rect x="98" y="132" width="28" height="28" rx="3" fill="#e8eefc" stroke="#334155" stroke-width="1.6"/><rect x="126" y="132" width="28" height="28" rx="3" fill="#e8eefc" stroke="#334155" stroke-width="1.6"/><rect x="70" y="160" width="28" height="28" rx="3" fill="#e8eefc" stroke="#334155" stroke-width="1.6"/><rect x="98" y="160" width="28" height="28" rx="3" fill="#e8eefc" stroke="#334155" stroke-width="1.6"/><rect x="126" y="160" width="28" height="28" rx="3" fill="#e8eefc" stroke="#334155" stroke-width="1.6"/><rect x="70" y="188" width="28" height="28" rx="3" fill="#e8eefc" stroke="#334155" stroke-width="1.6"/><rect x="98" y="188" width="28" height="28" rx="3" fill="#e8eefc" stroke="#334155" stroke-width="1.6"/><rect x="126" y="188" width="28" height="28" rx="3" fill="#e8eefc" stroke="#334155" stroke-width="1.6"/><rect x="70" y="216" width="28" height="28" rx="3" fill="#e8eefc" stroke="#334155" stroke-width="1.6"/><rect x="98" y="216" width="28" height="28" rx="3" fill="#e8eefc" stroke="#334155" stroke-width="1.6"/><rect x="126" y="216" width="28" height="28" rx="3" fill="#e8eefc" stroke="#334155" stroke-width="1.6"/>
<text x="112.0" y="123" font-size="17" text-anchor="middle" fill="#0f172a" font-weight="bold">m &gt; n  (tall)</text>
<rect x="300" y="132" width="28" height="28" rx="3" fill="#eafaf0" stroke="#334155" stroke-width="1.6"/><rect x="328" y="132" width="28" height="28" rx="3" fill="#eafaf0" stroke="#334155" stroke-width="1.6"/><rect x="356" y="132" width="28" height="28" rx="3" fill="#eafaf0" stroke="#334155" stroke-width="1.6"/><rect x="384" y="132" width="28" height="28" rx="3" fill="#eafaf0" stroke="#334155" stroke-width="1.6"/><rect x="300" y="160" width="28" height="28" rx="3" fill="#eafaf0" stroke="#334155" stroke-width="1.6"/><rect x="328" y="160" width="28" height="28" rx="3" fill="#eafaf0" stroke="#334155" stroke-width="1.6"/><rect x="356" y="160" width="28" height="28" rx="3" fill="#eafaf0" stroke="#334155" stroke-width="1.6"/><rect x="384" y="160" width="28" height="28" rx="3" fill="#eafaf0" stroke="#334155" stroke-width="1.6"/><rect x="300" y="188" width="28" height="28" rx="3" fill="#eafaf0" stroke="#334155" stroke-width="1.6"/><rect x="328" y="188" width="28" height="28" rx="3" fill="#eafaf0" stroke="#334155" stroke-width="1.6"/><rect x="356" y="188" width="28" height="28" rx="3" fill="#eafaf0" stroke="#334155" stroke-width="1.6"/><rect x="384" y="188" width="28" height="28" rx="3" fill="#eafaf0" stroke="#334155" stroke-width="1.6"/>
<text x="356.0" y="123" font-size="17" text-anchor="middle" fill="#0f172a" font-weight="bold">m &lt; n  (wide)</text>
<line x1="162.0" y1="188.0" x2="292.0" y2="174.0" stroke="#dc2626" stroke-width="1.9" marker-end="url(#ah)"/>
<text x="227.0" y="164" font-size="16" text-anchor="middle" fill="#dc2626" font-weight="bold">Muon: transpose</text>
<text x="40" y="268" font-size="17" text-anchor="start" fill="#334155" font-weight="normal">Muon transposes when m &gt; n, so Newton–Schulz</text>
<text x="40" y="292" font-size="17" text-anchor="start" fill="#334155" font-weight="normal">always runs on the short side min(m, n).</text>
<text x="40" y="316" font-size="17" text-anchor="start" fill="#0f766e" font-weight="normal">RMNP keeps the native shape, no transpose.</text>
<rect x="548" y="122" width="28" height="28" rx="3" fill="#ef4444" stroke="#334155" stroke-width="1.6"/><rect x="576" y="122" width="28" height="28" rx="3" fill="#ef4444" stroke="#334155" stroke-width="1.6"/><rect x="604" y="122" width="28" height="28" rx="3" fill="#ef4444" stroke="#334155" stroke-width="1.6"/><rect x="548" y="150" width="28" height="28" rx="3" fill="#f59e0b" stroke="#334155" stroke-width="1.6"/><rect x="576" y="150" width="28" height="28" rx="3" fill="#f59e0b" stroke="#334155" stroke-width="1.6"/><rect x="604" y="150" width="28" height="28" rx="3" fill="#f59e0b" stroke="#334155" stroke-width="1.6"/><rect x="548" y="178" width="28" height="28" rx="3" fill="#10b981" stroke="#334155" stroke-width="1.6"/><rect x="576" y="178" width="28" height="28" rx="3" fill="#10b981" stroke="#334155" stroke-width="1.6"/><rect x="604" y="178" width="28" height="28" rx="3" fill="#10b981" stroke="#334155" stroke-width="1.6"/><rect x="548" y="206" width="28" height="28" rx="3" fill="#3b82f6" stroke="#334155" stroke-width="1.6"/><rect x="576" y="206" width="28" height="28" rx="3" fill="#3b82f6" stroke="#334155" stroke-width="1.6"/><rect x="604" y="206" width="28" height="28" rx="3" fill="#3b82f6" stroke="#334155" stroke-width="1.6"/>
<text x="590.0" y="254" font-size="15" text-anchor="middle" fill="#475569" font-weight="normal">input = size(1)</text>
<text x="534" y="178" font-size="15" text-anchor="middle" fill="#475569" font-weight="normal" transform="rotate(-90 534 178)">output = size(0)</text>
