<text x="587.0" y="234" font-size="12" text-anchor="middle" fill="#475569" font-weight="normal">input = size(1)</text>
<text x="536" y="164" font-size="12" text-anchor="middle" fill="#475569" font-weight="normal" transform="rotate(-90 536 164)">output = size(0)</text>
