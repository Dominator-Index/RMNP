<svg xmlns="http://www.w3.org/2000/svg" width="980" height="470" viewBox="0 0 980 470" font-family="Helvetica,Arial,sans-serif">
<rect width="980" height="470" fill="#ffffff"/>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#555"/></marker></defs>
<text x="490.0" y="30" font-size="19" text-anchor="middle" fill="#0f172a" font-weight="bold">How Muon and RMNP treat a 2D update</text>
<line x1="490" y1="55" x2="490" y2="445" stroke="#cbd5e1" stroke-width="1.4"/>
<text x="250" y="58" font-size="16" text-anchor="middle" fill="#1e293b" font-weight="bold">1.  Matrix shape</text>
<text x="735" y="58" font-size="16" text-anchor="middle" fill="#1e293b" font-weight="bold">2.  Row normalization (RMNP)</text>
<rect x="70" y="92" width="30" height="30" rx="3" fill="#e8eefc" stroke="#334155" stroke-width="1.6"/><rect x="100" y="92" width="30" height="30" rx="3" fill="#e8eefc" stroke="#334155" stroke-width="1.6"/><rect x="130" y="92" width="30" height="30" rx="3" fill="#e8eefc" stroke="#334155" stroke-width="1.6"/><rect x="70" y="122" width="30" height="30" rx="3" fill="#e8eefc" stroke="#334155" stroke-width="1.6"/><rect x="100" y="122" width="30" height="30" rx="3" fill="#e8eefc" stroke="#334155" stroke-width="1.6"/><rect x="130" y="122" width="30" height="30" rx="3" fill="#e8eefc" stroke="#334155" stroke-width="1.6"/><rect x="70" y="152" width="30" height="30" rx="3" fill="#e8eefc" stroke="#334155" stroke-width="1.6"/><rect x="100" y="152" width="30" height="30" rx="3" fill="#e8eefc" stroke="#334155" stroke-width="1.6"/><rect x="130" y="152" width="30" height="30" rx="3" fill="#e8eefc" stroke="#334155" stroke-width="1.6"/><rect x="70" y="182" width="30" height="30" rx="3" fill="#e8eefc" stroke="#334155" stroke-width="1.6"/><rect x="100" y="182" width="30" height="30" rx="3" fill="#e8eefc" stroke="#334155" stroke-width="1.6"/><rect x="130" y="182" width="30" height="30" rx="3" fill="#e8eefc" stroke="#334155" stroke-width="1.6"/>
<text x="115.0" y="82" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="bold">m &gt; n   (4&#215;3, tall)</text>
<rect x="250" y="92" width="30" height="30" rx="3" fill="#eafaf0" stroke="#334155" stroke-width="1.6"/><rect x="280" y="92" width="30" height="30" rx="3" fill="#eafaf0" stroke="#334155" stroke-width="1.6"/><rect x="310" y="92" width="30" height="30" rx="3" fill="#eafaf0" stroke="#334155" stroke-width="1.6"/><rect x="340" y="92" width="30" height="30" rx="3" fill="#eafaf0" stroke="#334155" stroke-width="1.6"/><rect x="250" y="122" width="30" height="30" rx="3" fill="#eafaf0" stroke="#334155" stroke-width="1.6"/><rect x="280" y="122" width="30" height="30" rx="3" fill="#eafaf0" stroke="#334155" stroke-width="1.6"/><rect x="310" y="122" width="30" height="30" rx="3" fill="#eafaf0" stroke="#334155" stroke-width="1.6"/><rect x="340" y="122" width="30" height="30" rx="3" fill="#eafaf0" stroke="#334155" stroke-width="1.6"/><rect x="250" y="152" width="30" height="30" rx="3" fill="#eafaf0" stroke="#334155" stroke-width="1.6"/><rect x="280" y="152" width="30" height="30" rx="3" fill="#eafaf0" stroke="#334155" stroke-width="1.6"/><rect x="310" y="152" width="30" height="30" rx="3" fill="#eafaf0" stroke="#334155" stroke-width="1.6"/><rect x="340" y="152" width="30" height="30" rx="3" fill="#eafaf0" stroke="#334155" stroke-width="1.6"/>
<text x="310.0" y="82" font-size="14" text-anchor="middle" fill="#0f172a" font-weight="bold">m &lt; n   (3&#215;4, wide)</text>
<line x1="168" y1="152" x2="242" y2="137.0" stroke="#dc2626" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="205.0" y="144" font-size="12.5" text-anchor="middle" fill="#dc2626" font-weight="bold">Muon: transpose</text>
<text x="45" y="260" font-size="13.5" text-anchor="start" fill="#334155" font-weight="normal">Muon transposes the matrix when m &gt; n, so the</text>
<text x="45" y="282" font-size="13.5" text-anchor="start" fill="#334155" font-weight="normal">Newton–Schulz iteration always runs on the</text>
<text x="45" y="304" font-size="13.5" text-anchor="start" fill="#334155" font-weight="normal">short side min(m, n).</text>
<text x="45" y="334" font-size="13.5" text-anchor="start" fill="#0f766e" font-weight="normal">RMNP never transposes. It normalizes rows in</text>
<text x="45" y="356" font-size="13.5" text-anchor="start" fill="#0f766e" font-weight="normal">the native layout, tall or wide.</text>
<text x="680" y="92" font-size="12.5" text-anchor="middle" fill="#64748b" font-weight="normal">‖ row ‖₂  (varies)</text>
<text x="835" y="92" font-size="12.5" text-anchor="middle" fill="#64748b" font-weight="normal">after = 1</text>
<rect x="520" y="108" width="24" height="24" rx="3" fill="#ef4444" stroke="#334155" stroke-width="1.6"/>
<rect x="544" y="108" width="24" height="24" rx="3" fill="#ef4444" stroke="#334155" stroke-width="1.6"/>
<rect x="568" y="108" width="24" height="24" rx="3" fill="#ef4444" stroke="#334155" stroke-width="1.6"/>
