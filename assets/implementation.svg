<rect x="812" y="185" width="46" height="18" rx="3" fill="#f59e0b"/>
<rect x="520" y="256" width="24" height="24" rx="3" fill="#10b981" stroke="#334155" stroke-width="1.6"/>
<rect x="544" y="256" width="24" height="24" rx="3" fill="#10b981" stroke="#334155" stroke-width="1.6"/>
<rect x="568" y="256" width="24" height="24" rx="3" fill="#10b981" stroke="#334155" stroke-width="1.6"/>
<text x="512" y="273.28" font-size="12.5" text-anchor="end" fill="#334155" font-weight="normal">row 3</text>
<rect x="640" y="259" width="50.6" height="18" rx="3" fill="#10b981" opacity="0.9"/>
<line x1="713.6" y1="268.0" x2="802" y2="268.0" stroke="#555" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="812" y="259" width="46" height="18" rx="3" fill="#10b981"/>
