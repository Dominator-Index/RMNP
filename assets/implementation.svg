<rect x="640" y="333" width="41.4" height="18" rx="3" fill="#3b82f6" opacity="0.9"/>
<line x1="713.6" y1="342.0" x2="802" y2="342.0" stroke="#555" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="812" y="333" width="46" height="18" rx="3" fill="#3b82f6"/>
<text x="735" y="396" font-size="13" text-anchor="middle" fill="#334155" font-weight="normal">Each row is divided by its own L2 norm.</text>
</svg>