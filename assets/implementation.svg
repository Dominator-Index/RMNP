<text x="306.0" y="99" font-size="13.5" text-anchor="middle" fill="#0f172a" font-weight="bold">m &lt; n  (wide)</text>
<line x1="172.0" y1="164.0" x2="242.0" y2="150.0" stroke="#dc2626" stroke-width="1.9" marker-end="url(#ah)"/>
<text x="211.0" y="155" font-size="12.5" text-anchor="middle" fill="#dc2626" font-weight="bold">Muon: transpose</text>
<text x="40" y="250" font-size="13.5" text-anchor="start" fill="#334155" font-weight="normal">Muon transposes when m &gt; n, so Newton–Schulz</text>
<text x="40" y="271" font-size="13.5" text-anchor="start" fill="#334155" font-weight="normal">always runs on the short side min(m, n).</text>
<text x="40" y="295" font-size="13.5" text-anchor="start" fill="#0f766e" font-weight="normal">RMNP never transposes and keeps the native shape.</text>
